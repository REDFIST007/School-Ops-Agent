{% extends "base.html" %}
{% block title %}Login · School Ops Agent{% endblock %}
{% block content %}
<div class="grid">
  <div class="card">
    <h2>Sign In</h2>
    <form onsubmit="handleLogin(event)">
      <label>Email</label>
      <input type="email" id="login_email" required />
      <label>Password</label>
      <input type="password" id="login_password" required />
      <button type="submit">Login</button>
      <div id="login_msg" class="status-msg"></div>
    </form>
  </div>
  <div class="card">
    <h2>Accept Scoped Invite</h2>
    <p style="font-size:13px;color:var(--muted);">Use an <code>INV-XXXXXXXX</code> code issued by your school admin or teacher.</p>
    <form onsubmit="handleInvite(event)">
      <label>Invite Code</label>
      <input type="text" id="inv_code" placeholder="INV-XXXXXXXX" required />
      <label>Email</label>
      <input type="email" id="inv_email" required />
      <label>Password</label>
      <input type="password" id="inv_password" minlength="6" required />
      <button type="submit">Join School</button>
      <div id="inv_msg" class="status-msg"></div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function handleLogin(e) {
  e.preventDefault();
  try {
    await apiPost('/api/auth/login', {
      email: document.getElementById('login_email').value,
      password: document.getElementById('login_password').value
    });
    window.location.href = '/dashboard';
  } catch (err) {
    document.getElementById('login_msg').textContent = err.message;
  }
}
async function handleInvite(e) {
  e.preventDefault();
  try {
    await apiPost('/api/auth/accept-invite', {
      code: document.getElementById('inv_code').value,
      email: document.getElementById('inv_email').value,
      password: document.getElementById('inv_password').value
    });
    window.location.href = '/dashboard';
  } catch (err) {
    document.getElementById('inv_msg').textContent = err.message;
  }
}
</script>
{% endblock %}
