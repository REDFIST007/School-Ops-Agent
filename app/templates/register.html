{% extends "base.html" %}
{% block title %}Register School · School Ops Agent{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:0 auto;">
  <h2>Register a New School</h2>
  <form onsubmit="handleRegister(event)">
    <label>School Name</label>
    <input type="text" id="school_name" placeholder="Sunrise Public School" required />
    <label>Coordinator / Admin Name</label>
    <input type="text" id="admin_name" required />
    <label>Admin Email</label>
    <input type="email" id="admin_email" required />
    <label>Password (min 6 chars)</label>
    <input type="password" id="admin_password" minlength="6" required />
    <button type="submit">Register School &amp; Sign In</button>
    <div id="reg_msg" class="status-msg"></div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
async function handleRegister(e) {
  e.preventDefault();
  try {
    await apiPost('/api/auth/register', {
      school_name: document.getElementById('school_name').value,
      admin_name: document.getElementById('admin_name').value,
      admin_email: document.getElementById('admin_email').value,
      password: document.getElementById('admin_password').value
    });
    window.location.href = '/dashboard';
  } catch (err) {
    document.getElementById('reg_msg').textContent = err.message;
  }
}
</script>
{% endblock %}
